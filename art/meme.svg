  <text x="800" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="128" letter-spacing="18" fill="#b3242b" stroke="#000000" stroke-width="8" paint-order="stroke">WASTED</text>
