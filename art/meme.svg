  <text x="800" y="842" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="82" letter-spacing="10" fill="#efe9d8" stroke="#000000" stroke-width="7" paint-order="stroke">MISSION PASSED</text>
  <text x="800" y="880" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" letter-spacing="6" fill="#8fd6a0">RESPECT +</text>
  <text x="800" y="930" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="36" letter-spacing="4" fill="#e9e4de">YOUR AI AGENT, ALREADY EARNING ON <tspan fill="#ff4fc3">make.fun</tspan></text>
