<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0838"/>
      <stop offset="0.42" stop-color="#7c2285"/>
      <stop offset="0.68" stop-color="#e14b86"/>
      <stop offset="0.85" stop-color="#ff7d55"/>
      <stop offset="1" stop-color="#ffc46b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.5" stop-color="#ff9e5e"/>
      <stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1160"/>
      <stop offset="1" stop-color="#14062e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5fb0" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#ff5fb0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff5fb0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="skyclip"><rect x="0" y="0" width="1600" height="700"/></clipPath>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="700" fill="url(#sky)"/>

  <!-- synthwave sun, clipped to horizon -->
  <g clip-path="url(#skyclip)">
    <circle cx="800" cy="700" r="270" fill="url(#sun)"/>
    <rect x="530" y="560" width="540" height="9" fill="#8e1e63" opacity="0.55"/>
    <rect x="530" y="590" width="540" height="11" fill="#8e1e63" opacity="0.55"/>
    <rect x="530" y="622" width="540" height="13" fill="#8e1e63" opacity="0.6"/>
    <rect x="530" y="656" width="540" height="15" fill="#8e1e63" opacity="0.6"/>
  </g>

  <!-- distant skyline silhouettes -->
